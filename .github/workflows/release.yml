name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Test and check
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version.' }
      - name: Build single-file launcher
        shell: powershell
        run: ./scripts/build-release.ps1 -Repository '${{ github.repository }}' -OutputDirectory release
      - name: Smoke-test bundled runtime and isolated data
        shell: powershell
        run: ./scripts/test-bundle.ps1 -ArtifactDirectory release
      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AION-Workshop-Windows
          path: |
            release/AION-Workshop.exe
            release/AION-Workshop-App.zip
            release/update.json
            release/SHA256SUMS.txt
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view "$env:GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing -eq 'false') { Write-Output 'Published release already exists; immutable assets kept.'; exit 0 }
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --draft --verify-tag --title "AION Workshop $env:GITHUB_REF_NAME" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload "$env:GITHUB_REF_NAME" release/AION-Workshop.exe release/AION-Workshop-App.zip release/update.json release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:GITHUB_REF_NAME" --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
